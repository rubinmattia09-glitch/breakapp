# Configurazione per Render.com (https://render.com)
# 1) Collega il repo GitHub.
# 2) Render crea un Web Service partendo da questo file.
# 3) IMPOSTA la variabile OPENAI_API_KEY nella dashboard (non va nel repo!).
#    Le altre sono già preimpostate ma puoi cambiarle.
services:
  - type: web
    name: breakapp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    env:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      # Database degli account su Turso (SQLite nel cloud, gratis).
      # Crea un DB su https://turso.tech e incolla qui URL e Token.
      # Se le lasci vuote, il server usa un SQLite locale (azzerato a ogni deploy).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
